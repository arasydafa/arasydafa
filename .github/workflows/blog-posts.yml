name: Latest Medium posts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update-medium.py
      - run: |
          git config user.name "medium-bot"
          git config user.email "medium-bot@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update Medium posts" && git push)
